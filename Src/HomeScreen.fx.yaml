HomeScreen As screen:
    Fill: =RGBA(245, 245, 250, 1)

    HeaderRect As rectangle:
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =140
        Fill: =RGBA(63, 81, 181, 1)

    AppIconLabel As label:
        X: =0
        Y: =30
        Width: =Parent.Width
        Height: =50
        Text: ="📚"
        Align: =Align.Center
        Size: =36
        Color: =RGBA(255, 255, 255, 1)

    TitleLabel As label:
        X: =0
        Y: =85
        Width: =Parent.Width
        Height: =40
        Text: ="Book Recommender"
        Align: =Align.Center
        Size: =22
        Color: =RGBA(255, 255, 255, 1)
        FontWeight: =FontWeight.Bold

    SubtitleLabel As label:
        X: =20
        Y: =165
        Width: =Parent.Width - 40
        Height: =50
        Text: ="Select a genre to get personalised book recommendations."
        Align: =Align.Center
        Size: =14
        Color: =RGBA(90, 90, 120, 1)

    GenreLabel As label:
        X: =20
        Y: =235
        Width: =Parent.Width - 40
        Height: =30
        Text: ="Choose a Genre"
        Size: =15
        FontWeight: =FontWeight.Semibold
        Color: =RGBA(50, 50, 80, 1)

    GenreDropdown As dropdown:
        X: =20
        Y: =270
        Width: =Parent.Width - 40
        Height: =55
        Items: =["Fiction", "Mystery", "Sci-Fi", "Fantasy", "Biography"]
        BorderColor: =RGBA(63, 81, 181, 1)
        BorderThickness: =2
        Color: =RGBA(30, 30, 60, 1)
        Size: =15

    RecommendBtn As button:
        X: =20
        Y: =360
        Width: =Parent.Width - 40
        Height: =60
        Text: ="Get Recommendations"
        Fill: =RGBA(63, 81, 181, 1)
        Color: =RGBA(255, 255, 255, 1)
        Size: =16
        FontWeight: =FontWeight.Bold
        BorderRadius: =8
        OnSelect: |
            =ClearCollect(
                FilteredBooks,
                Filter(BooksCollection, Genre = GenreDropdown.SelectedText)
            );
            Navigate(RecommendationsScreen, ScreenTransition.Fade)

    FooterLabel As label:
        X: =0
        Y: =Parent.Height - 50
        Width: =Parent.Width
        Height: =40
        Text: ="BookBot • Powered by Power Apps"
        Align: =Align.Center
        Size: =12
        Color: =RGBA(160, 160, 180, 1)
